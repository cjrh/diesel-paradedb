name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    # Live integration tests under tests/live_paradedb.rs hit a real
    # ParadeDB instance on localhost:5432. POSTGRES_PASSWORD=parade
    # matches the default TEST_DATABASE_URL baked into that file, so
    # no env override is needed.
    services:
      paradedb:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_PASSWORD: parade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: unit tests
        run: cargo test --lib

      - name: live integration tests
        run: cargo test --test live_paradedb -- --ignored
