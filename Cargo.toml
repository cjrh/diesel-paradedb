[package]
name = "diesel-paradedb"
version = "1.1.0"
edition = "2021"
rust-version = "1.86"
description = "Diesel ORM bindings for ParadeDB's pg_search extension — BM25 search, structured queries, scoring, and aggregates."
documentation = "https://docs.rs/diesel-paradedb"
repository = "https://github.com/cjrh/diesel-paradedb"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["diesel", "paradedb", "postgres", "bm25", "search"]
categories = ["database"]

[dependencies]
# Diesel 2.2 and 2.3 are both supported. Diesel has, in practice, broken
# extension crates on minor bumps before, so the upper bound is explicit
# rather than `^2` — each new diesel minor needs to be validated against
# this crate's tests before the bound is widened.
#
# `with-deprecated` re-exports the `#[derive(SqlType)]` / `#[derive(QueryId)]`
# proc-macros at `diesel::SqlType` / `diesel::QueryId`. It is on by
# default in Diesel; we enable it explicitly here so this crate compiles
# even when downstream callers disabled their own default features.
diesel = { version = ">=2.2, <2.4", default-features = false, features = ["postgres_backend", "with-deprecated"] }
serde_json = "1"

[dev-dependencies]
# Tested against the upper-bound diesel minor (2.3); the runtime range
# above still permits 2.2 downstream. `postgres` feature pulls in the
# runtime client used for the live-DB integration tests under `tests/`.
# Library users that only want the typed DSL never need it; their own
# crate brings the connection type. `testcontainers` makes live tests and
# examples self-contained, and `pgvector` is used only by hybrid/RAG examples.
diesel = { version = "~2.3", features = ["postgres", "postgres_backend", "serde_json"] }
diesel-async = { version = "~0.9", features = ["postgres", "bb8"] }
# testcontainers 0.22 accepts these transitive ranges; pin below newer
# releases that raised MSRV beyond this crate's Rust 1.86 floor.
home = "=0.5.9"
serde_with = "=3.15.1"
pgvector = { version = "0.4", features = ["diesel"] }
testcontainers = "0.22.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lib]
# README is rendered as the crate-level doc via `#![doc = include_str!(...)]`.
# Disabling doctests on the lib avoids the README's prose-code-blocks
# being run as standalone doctests against a real DB.
doctest = false

[package.metadata.docs.rs]
# Build the docs.rs page against the same feature set users get by
# default. No extras to enable today; reserved here so future opt-in
# features (e.g. `pgvector-interop`) get rendered automatically.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
